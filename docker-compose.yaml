services:
  db:
    image: postgres:16-alpine
    container_name: lab2pepe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    container_name: lab2pepe_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "${CONN_STR}", "up"]
    restart: on-failure

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab2pepe_server
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CONN_STR: ${CONN_STR}
      UPLOAD_DIR: /app/out
    volumes:
      - uploads:/app/out
    ports:
      - "9091:9091"

volumes:
  pg_data:
  uploads: